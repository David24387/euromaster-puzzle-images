<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUROMASTER Monday Challenge</title>
  <style>
    :root {
      --primary-color: #003366; /* EUROMASTER Blau */
      --accent-color: #e30613;  /* EUROMASTER Rot */
      --bg-color: #f4f6f9;
      --board-size: 300px;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .puzzle-container {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    h2 {
      color: var(--primary-color);
      margin: 0 0 5px 0;
      font-size: 1.4rem;
    }

    .user-badge {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 12px;
      background: #eef3f8;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background-color: #f0f4f8;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: var(--primary-color);
    }

    #board {
      width: var(--board-size);
      height: var(--board-size);
      position: relative;
      border: 3px solid var(--primary-color);
      border-radius: 6px;
      background-color: #ddd;
      margin: 0 auto;
      overflow: hidden;
    }

    .tile {
      width: 98px;
      height: 98px;
      position: absolute;
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      background-size: var(--board-size) var(--board-size);
      box-sizing: border-box;
    }

    .tile:hover {
      filter: brightness(1.1);
    }

    .message-box {
      margin-top: 12px;
      font-weight: bold;
      color: #2e7d32;
      min-height: 24px;
    }

    /* Ranglisten-Styling */
    .leaderboard {
      margin-top: 20px;
      text-align: left;
      border-top: 2px solid #eef3f8;
      padding-top: 15px;
    }

    .leaderboard h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: var(--primary-color);
      text-align: center;
    }

    .leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .leaderboard-item:nth-child(1) { font-weight: bold; color: #d4af37; } /* Platz 1 Gold */
    .leaderboard-item:nth-child(2) { font-weight: bold; color: #a8a8a8; } /* Platz 2 Silber */
    .leaderboard-item:nth-child(3) { font-weight: bold; color: #b87333; } /* Platz 3 Bronze */
  </style>
</head>
<body>

  <div class="puzzle-container">
    <h2>EUROMASTER Monday Challenge</h2>
    <div class="user-badge">Hallo, <span id="username-display">Gast</span>!</div>

    <div class="stats">
      <div>Zeit: <span id="timer">00:00</span></div>
      <div>Züge: <span id="moves">0</span></div>
    </div>

    <div id="board"></div>
    <div id="message" class="message-box"></div>

    <!-- RANGLISTE -->
    <div class="leaderboard">
      <h3>🏆 Wochen-Bestenliste</h3>
      <ol id="leaderboard-list" class="leaderboard-list">
        <li style="text-align:center; color:#888; font-size:0.8rem;">Noch keine Zeiten diese Woche.</li>
      </ol>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. BENUTZER ERKENNEN (URL Parameter oder Prompt)
    // =========================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let currentUser = urlParams.get('user');

    // Falls kein Name in der URL mitgegeben wurde (z.B. ?user=Max):
    if (!currentUser) {
      currentUser = localStorage.getItem("puzzle_username");
      if (!currentUser) {
        currentUser = prompt("Willkommen bei der EUROMASTER Challenge! Wie ist dein Name?", "Kollege") || "Anonym";
        localStorage.setItem("puzzle_username", currentUser);
      }
    }
    document.getElementById("username-display").innerText = currentUser;

    // =========================================================================
    // 2. GITHUB KONFIGURATION & MONTAGS-LOGIK
    // =========================================================================
    const githubUsername = "David24387"; 
    const repositoryName = "euromaster-puzzle-images";
    const totalImages = 36;

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    const currentWeek = getWeekNumber(new Date());
    const startWeek = 33; 
    let weekIndex = currentWeek - startWeek;
    if (weekIndex < 0) weekIndex += 52;

    const imageNumber = (weekIndex % totalImages) + 1;
    let imageUrl = `https://raw.githubusercontent.com/${githubUsername}/${repositoryName}/main/${imageNumber}.jpg`;

    // =========================================================================
    // 3. SPIEL-LOGIK
    // =========================================================================
    const board = document.getElementById("board");
    const timerEl = document.getElementById("timer");
    const movesEl = document.getElementById("moves");
    const messageEl = document.getElementById("message");

    const size = 3;
    const tileSize = 100;
    let tiles = [];
    let emptyPos = { row: 2, col: 2 };
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let gameStarted = false;
    let gameFinished = false;

    const puzzleImg = new Image();
    puzzleImg.src = imageUrl;
    puzzleImg.onload = () => { initGame(); updateLeaderboardUI(); };
    puzzleImg.onerror = () => {
      const masterUrl = `https://raw.githubusercontent.com/${githubUsername}/${repositoryName}/master/${imageNumber}.jpg`;
      const fallbackImg = new Image();
      fallbackImg.src = masterUrl;
      fallbackImg.onload = () => { imageUrl = masterUrl; initGame(); updateLeaderboardUI(); };
      fallbackImg.onerror = () => { messageEl.innerText = "Fehler beim Laden des Bildes."; };
    };

    function initGame() {
      board.innerHTML = "";
      tiles = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (r === size - 1 && c === size - 1) break;

          const tile = document.createElement("div");
          tile.classList.add("tile");
          tile.style.backgroundImage = `url('${imageUrl}')`;
          tile.style.backgroundPosition = `-${c * tileSize}px -${r * tileSize}px`;
          
          const pos = { row: r, col: c, correctRow: r, correctCol: c, element: tile };
          tiles.push(pos);
          tile.addEventListener("click", () => moveTile(pos));
          board.appendChild(tile);
          updatePosition(pos);
        }
      }
      shuffle();
    }

    function updatePosition(tile) {
      tile.element.style.top = `${tile.row * tileSize}px`;
      tile.element.style.left = `${tile.col * tileSize}px`;
    }

    function moveTile(tile) {
      if (gameFinished) return;
      const isAdjacent = (Math.abs(tile.row - emptyPos.row) + Math.abs(tile.col - emptyPos.col)) === 1;
      if (isAdjacent) {
        if (!gameStarted) startTimer();
        const tempRow = tile.row;
        const tempCol = tile.col;
        tile.row = emptyPos.row;
        tile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };
        updatePosition(tile);
        moves++;
        movesEl.innerText = moves;
        checkWin();
      }
    }

    function shuffle() {
      for (let i = 0; i < 100; i++) {
        const validTiles = tiles.filter(t => (Math.abs(t.row - emptyPos.row) + Math.abs(t.col - emptyPos.col)) === 1);
        const randomTile = validTiles[Math.floor(Math.random() * validTiles.length)];
        const tempRow = randomTile.row;
        const tempCol = randomTile.col;
        randomTile.row = emptyPos.row;
        randomTile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };
        updatePosition(randomTile);
      }
    }

    function startTimer() {
      gameStarted = true;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function checkWin() {
      const isSolved = tiles.every(t => t.row === t.correctRow && t.col === t.correctCol);
      if (isSolved) {
        clearInterval(timerInterval);
        gameFinished = true;
        messageEl.innerText = `Glückwunsch, ${currentUser}! Gelöst in ${seconds}s.`;
        saveScore(currentUser, seconds, moves);
      }
    }

    // =========================================================================
    // 4. RANGLISTE SPEICHERN & ANZEIGEN
    // =========================================================================
    function saveScore(name, time, movesCount) {
      const storageKey = `em_leaderboard_kw${currentWeek}`;
      let scores = JSON.parse(localStorage.getItem(storageKey)) || [];

      // Prüfen, ob der Nutzer bereits eine Zeit eingetragen hat (nur beste Zeit behalten)
      const existingUserIndex = scores.findIndex(entry => entry.name === name);
      if (existingUserIndex !== -1) {
        if (time < scores[existingUserIndex].time) {
          scores[existingUserIndex] = { name, time, moves: movesCount };
        }
      } else {
        scores.push({ name, time, moves: movesCount });
      }

      // Nach schnellster Zeit sortieren
      scores.sort((a, b) => a.time - b.time);

      localStorage.setItem(storageKey, JSON.stringify(scores));
      updateLeaderboardUI();

      /* 
        HINWEIS FÜR DIE ANBINDUNG AN EURE DATERBANK:
        Hier könnt ihr auch ein HTTP POST an euer Masternet-Backend senden:
        
        fetch('/api/puzzle/save', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ user: name, week: currentWeek, time: time })
        });
      */
    }

    function updateLeaderboardUI() {
      const storageKey = `em_leaderboard_kw${currentWeek}`;
      const scores = JSON.parse(localStorage.getItem(storageKey)) || [];
      const listEl = document.getElementById("leaderboard-list");

      if (scores.length === 0) return;

      listEl.innerHTML = "";
      scores.slice(0, 5).forEach((entry, index) => {
        const li = document.createElement("li");
        li.className = "leaderboard-item";
        
        const mins = String(Math.floor(entry.time / 60)).padStart(2, '0');
        const secs = String(entry.time % 60).padStart(2, '0');
        
        li.innerHTML = `
          <span><strong>${index + 1}.</strong> ${entry.name}</span>
          <span>${mins}:${secs} (${entry.moves} Züge)</span>
        `;
        listEl.appendChild(li);
      });
    }
  </script>
</body>
</html>
