<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EUROMASTER Monday Challenge</title>
  <style>
    :root {
      --primary-color: #003366; /* EUROMASTER Blau */
      --accent-color: #e30613;  /* EUROMASTER Rot */
      --bg-color: #f4f6f9;
      --board-size: min(300px, 80vw);
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-color);
      margin: 0;
      padding: 10px;
      color: #333;
    }

    .puzzle-container {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 360px;
      position: relative;
    }

    h2 {
      color: var(--primary-color);
      margin: 0 0 5px 0;
      font-size: 1.2rem;
    }

    .user-badge {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 10px;
      background: #eef3f8;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .change-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background-color: #f0f4f8;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--primary-color);
    }

    #board {
      width: var(--board-size);
      height: var(--board-size);
      position: relative;
      border: 3px solid var(--primary-color);
      border-radius: 6px;
      background-color: #ddd;
      margin: 0 auto;
      overflow: hidden;
    }

    .tile {
      width: calc(var(--board-size) / 3 - 2px);
      height: calc(var(--board-size) / 3 - 2px);
      position: absolute;
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      background-size: var(--board-size) var(--board-size);
    }

    .tile:active {
      transform: scale(0.98);
    }

    .message-box {
      margin-top: 10px;
      font-weight: bold;
      color: #2e7d32;
      min-height: 20px;
      font-size: 0.85rem;
    }

    .leaderboard {
      margin-top: 15px;
      text-align: left;
      border-top: 2px solid #eef3f8;
      padding-top: 10px;
    }

    .leaderboard h3 {
      margin: 0 0 8px 0;
      font-size: 1rem;
      color: var(--primary-color);
      text-align: center;
    }

    .leaderboard-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      font-size: 0.8rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .leaderboard-item:nth-child(1) { font-weight: bold; color: #d4af37; }
    .leaderboard-item:nth-child(2) { font-weight: bold; color: #7f8c8d; }
    .leaderboard-item:nth-child(3) { font-weight: bold; color: #a0522d; }

    .admin-trigger {
      position: absolute;
      bottom: 5px;
      right: 8px;
      background: none;
      border: none;
      opacity: 0.3;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .admin-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
      z-index: 10;
    }

    .admin-btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .admin-btn-mail { background-color: var(--primary-color); color: #fff; }
    .admin-btn-delete { background-color: var(--accent-color); color: #fff; }
    .admin-btn-close { background-color: #ccc; color: #333; }
  </style>
</head>
<body>

  <div class="puzzle-container">
    <h2>EUROMASTER Challenge</h2>
    <div class="user-badge">
      <span>Spieler: <strong id="username-display">Lädt...</strong></span>
      <button class="change-btn" onclick="changeUsername()">(Konto)</button>
    </div>

    <div class="stats">
      <div>Zeit: <span id="timer">00:00</span></div>
      <div>Züge: <span id="moves">0</span></div>
    </div>

    <div id="board"></div>
    <div id="message" class="message-box"></div>

    <div class="leaderboard">
      <h3 id="leaderboard-title">🏆 Wochen-Bestenliste</h3>
      <ol id="leaderboard-list" class="leaderboard-list">
        <li style="text-align:center; color:#888; font-size:0.8rem;">Lädt...</li>
      </ol>
    </div>

    <button class="admin-trigger" onclick="openAdminMenu()">⚙️</button>

    <div id="admin-modal" class="admin-modal">
      <h3 style="margin: 0; color: var(--primary-color);">Admin-Bereich</h3>
      <button class="admin-btn admin-btn-mail" onclick="sendReportMail()">📧 Bericht per Mail senden</button>
      <button class="admin-btn admin-btn-delete" onclick="deleteCurrentLeaderboard()">🗑️ Rangliste dieser Woche löschen</button>
      <button class="admin-btn admin-btn-close" onclick="closeAdminMenu()">Schließen</button>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://euromaster-puzzle-default-rtdb.europe-west1.firebasedatabase.app"; 
    const ADMIN_PIN = "1234";
    const ADMIN_EMAIL = "david.mueller@euromaster.com";

    let currentUser = localStorage.getItem("em_puzzle_username");

    function initUser() {
      if (!currentUser || currentUser.trim() === "") {
        promptForUsername();
      } else {
        document.getElementById("username-display").innerText = currentUser;
      }
    }

    function promptForUsername() {
      const input = prompt("Willkommen! Bitte gib deinen Namen ein:", currentUser || "");
      if (input && input.trim() !== "") {
        currentUser = input.trim();
        localStorage.setItem("em_puzzle_username", currentUser);
      } else if (!currentUser) {
        currentUser = "Anonym";
      }
      document.getElementById("username-display").innerText = currentUser;
    }

    function changeUsername() {
      promptForUsername();
    }

    initUser();

    // MONTAGS-LOGIK
    const githubUsername = "David24387"; 
    const repositoryName = "euromaster-puzzle-images";
    const totalImages = 36;

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    const currentWeek = getWeekNumber(new Date());
    document.getElementById("leaderboard-title").innerText = `🏆 Bestenliste (KW ${currentWeek})`;

    const startWeek = 33; 
    let weekIndex = currentWeek - startWeek;
    if (weekIndex < 0) weekIndex += 52;

    const imageNumber = (weekIndex % totalImages) + 1;
    let imageUrl = `https://raw.githubusercontent.com/${githubUsername}/${repositoryName}/main/${imageNumber}.jpg`;

    // SPIEL-LOGIK
    const board = document.getElementById("board");
    const timerEl = document.getElementById("timer");
    const movesEl = document.getElementById("moves");
    const messageEl = document.getElementById("message");

    const size = 3;
    let tiles = [];
    let emptyPos = { row: 2, col: 2 };
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let gameStarted = false;
    let gameFinished = false;

    const puzzleImg = new Image();
    puzzleImg.src = imageUrl;
    puzzleImg.onload = () => { initGame(); loadGlobalLeaderboard(); };
    puzzleImg.onerror = () => {
      const masterUrl = `https://raw.githubusercontent.com/${githubUsername}/${repositoryName}/master/${imageNumber}.jpg`;
      const fallbackImg = new Image();
      fallbackImg.src = masterUrl;
      fallbackImg.onload = () => { imageUrl = masterUrl; initGame(); loadGlobalLeaderboard(); };
      fallbackImg.onerror = () => { messageEl.innerText = "Fehler beim Laden des Bildes."; };
    };

    function initGame() {
      board.innerHTML = "";
      tiles = [];
      const boardWidth = board.clientWidth;
      const tileSize = boardWidth / size;

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (r === size - 1 && c === size - 1) break;

          const tile = document.createElement("div");
          tile.classList.add("tile");
          tile.style.backgroundImage = `url('${imageUrl}')`;
          tile.style.backgroundPosition = `-${c * tileSize}px -${r * tileSize}px`;
          
          const pos = { row: r, col: c, correctRow: r, correctCol: c, element: tile };
          tiles.push(pos);
          
          tile.addEventListener("click", () => moveTile(pos));
          board.appendChild(tile);
          updatePosition(pos);
        }
      }
      shuffle();
    }

    function updatePosition(tile) {
      const boardWidth = board.clientWidth;
      const tileSize = boardWidth / size;
      tile.element.style.top = `${tile.row * tileSize}px`;
      tile.element.style.left = `${tile.col * tileSize}px`;
    }

    function moveTile(tile) {
      if (gameFinished) return;
      const isAdjacent = (Math.abs(tile.row - emptyPos.row) + Math.abs(tile.col - emptyPos.col)) === 1;
      if (isAdjacent) {
        if (!gameStarted) startTimer();
        const tempRow = tile.row;
        const tempCol = tile.col;
        tile.row = emptyPos.row;
        tile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };
        updatePosition(tile);
        moves++;
        movesEl.innerText = moves;
        checkWin();
      }
    }

    function shuffle() {
      for (let i = 0; i < 100; i++) {
        const validTiles = tiles.filter(t => (Math.abs(t.row - emptyPos.row) + Math.abs(t.col - emptyPos.col)) === 1);
        const randomTile = validTiles[Math.floor(Math.random() * validTiles.length)];
        const tempRow = randomTile.row;
        const tempCol = randomTile.col;
        randomTile.row = emptyPos.row;
        randomTile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };
        updatePosition(randomTile);
      }
    }

    function startTimer() {
      gameStarted = true;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function checkWin() {
      const isSolved = tiles.every(t => t.row === t.correctRow && t.col === t.correctCol);
      if (isSolved) {
        clearInterval(timerInterval);
        gameFinished = true;
        messageEl.style.color = "#2e7d32";
        messageEl.innerText = `Glückwunsch! Speichere Zeit...`;
        saveScoreToGlobalLeaderboard(currentUser, seconds, moves);
      }
    }

    // FIREBASE SPEICHERUNG & ABFRAGE
    let cachedScores = [];

    async function loadGlobalLeaderboard() {
      try {
        const response = await fetch(`${FIREBASE_DB_URL}/kw${currentWeek}.json`);
        if (!response.ok) throw new Error("Load Fail");
        const data = await response.json();
        
        cachedScores = [];
        if (data) {
          cachedScores = Object.values(data);
          cachedScores.sort((a, b) => a.time - b.time);
        }
        renderLeaderboard(cachedScores);
      } catch (err) {
        console.error("Ladefehler:", err);
      }
    }

    async function saveScoreToGlobalLeaderboard(name, time, movesCount) {
      try {
        const safeUserId = name.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
        const userUrl = `${FIREBASE_DB_URL}/kw${currentWeek}/${safeUserId}.json`;

        const checkRes = await fetch(userUrl);
        let shouldSave = true;

        if (checkRes.ok) {
          const existingData = await checkRes.json();
          if (existingData && existingData.time <= time) {
            shouldSave = false;
          }
        }

        if (shouldSave) {
          await fetch(userUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, time, moves: movesCount })
          });
        }

        messageEl.style.color = "#2e7d32";
        messageEl.innerText = `Glückwunsch, ${name}! Zeit gespeichert.`;
        loadGlobalLeaderboard();

      } catch (err) {
        console.error("Speicherfehler:", err);
        messageEl.style.color = "#c62828";
        messageEl.innerText = "Fehler beim Speichern der Zeit.";
      }
    }

    function renderLeaderboard(scores) {
      const listEl = document.getElementById("leaderboard-list");
      listEl.innerHTML = "";

      if (scores.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:#888; font-size:0.8rem;">Noch keine Zeiten in dieser Woche.</li>';
        return;
      }

      scores.slice(0, 5).forEach((entry, index) => {
        const li = document.createElement("li");
        li.className = "leaderboard-item";
        
        const mins = String(Math.floor(entry.time / 60)).padStart(2, '0');
        const secs = String(entry.time % 60).padStart(2, '0');
        
        li.innerHTML = `
          <span><strong>${index + 1}.</strong> ${entry.name}</span>
          <span>${mins}:${secs} (${entry.moves} Z.)</span>
        `;
        listEl.appendChild(li);
      });
    }

    // ADMIN-PANEL LOGIK
    function openAdminMenu() {
      const pin = prompt("Bitte Admin-PIN eingeben:");
      if (pin === ADMIN_PIN) {
        document.getElementById("admin-modal").style.display = "flex";
      } else if (pin !== null) {
        alert("Falsche PIN!");
      }
    }

    function closeAdminMenu() {
      document.getElementById("admin-modal").style.display = "none";
    }

    function sendReportMail() {
      if (cachedScores.length === 0) {
        alert("Keine Daten für KW " + currentWeek + " vorhanden.");
        return;
      }

      let reportText = `Auswertung EUROMASTER Challenge - KW ${currentWeek}:\n\n`;
      let mailBody = `Hallo David,%0D%0A%0D%0AHier ist die Auswertung der EUROMASTER Challenge für KW ${currentWeek}:%0D%0A%0D%0A`;
      
      cachedScores.forEach((entry, index) => {
        const mins = String(Math.floor(entry.time / 60)).padStart(2, '0');
        const secs = String(entry.time % 60).padStart(2, '0');
        
        reportText += `${index + 1}. ${entry.name} - ${mins}:${secs} (${entry.moves} Züge)\n`;
        mailBody += `${index + 1}. ${entry.name} - ${mins}:${secs} (${entry.moves} Züge)%0D%0A`;
      });

      mailBody += `%0D%0AViele Grüße%0D%0ADEIN PUZZLE WIDGET`;

      // 1. In Zwischenablage kopieren (als Backup)
      navigator.clipboard.writeText(reportText).then(() => {
        console.log("In Zwischenablage kopiert.");
      }).catch(() => {});

      // 2. Mail-Link öffnen über Top-Window oder Fallback
      const mailUrl = `mailto:${ADMIN_EMAIL}?subject=Rangliste EUROMASTER Challenge KW ${currentWeek}&body=${mailBody}`;
      
      try {
        window.open(mailUrl, '_blank');
        alert("Mail-Programm wird geöffnet!\n\n(Die Ergebnisse wurden zusätzlich auch in deine Zwischenablage kopiert)");
      } catch(e) {
        alert("Ergebnisse wurden in die Zwischenablage kopiert! Füge sie einfach mit Strg+V in deine Mail ein.");
      }
    }

    async function deleteCurrentLeaderboard() {
      const confirmDelete = confirm(`Möchtest du die Rangliste für KW ${currentWeek} wirklich unwiderruflich löschen?`);
      if (confirmDelete) {
        try {
          await fetch(`${FIREBASE_DB_URL}/kw${currentWeek}.json`, { method: "DELETE" });
          alert(`Rangliste für KW ${currentWeek} wurde erfolgreich gelöscht!`);
          closeAdminMenu();
          loadGlobalLeaderboard();
        } catch (err) {
          alert("Fehler beim Löschen der Rangliste.");
        }
      }
    }
  </script>
</body>
</html>
