<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUROMASTER Monday Challenge</title>
  <style>
    :root {
      --primary-color: #003366; /* EUROMASTER Blau */
      --accent-color: #e30613;  /* Akzentfarbe */
      --bg-color: #f4f6f9;
      --board-size: 300px;      /* Gesamtgröße des Spielfelds */
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .puzzle-container {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    h2 {
      color: var(--primary-color);
      margin: 0 0 5px 0;
      font-size: 1.4rem;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 15px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background-color: #f0f4f8;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: var(--primary-color);
    }

    #board {
      width: var(--board-size);
      height: var(--board-size);
      position: relative;
      border: 3px solid var(--primary-color);
      border-radius: 6px;
      background-color: #ddd;
      margin: 0 auto;
      overflow: hidden;
    }

    .tile {
      width: 98px;
      height: 98px;
      position: absolute;
      border: 1px solid #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      background-size: var(--board-size) var(--board-size);
      box-sizing: border-box;
    }

    .tile:hover {
      filter: brightness(1.1);
    }

    .message-box {
      margin-top: 15px;
      font-weight: bold;
      color: #2e7d32;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="puzzle-container">
    <h2>EUROMASTER Monday Challenge</h2>
    <p class="subtitle">Schaffst du das Puzzle heute am schnellsten?</p>

    <div class="stats">
      <div>Zeit: <span id="timer">00:00</span></div>
      <div>Züge: <span id="moves">0</span></div>
    </div>

    <div id="board"></div>
    <div id="message" class="message-box"></div>
  </div>

  <script>
    // =========================================================================
    // 1. GITHUB KONFIGURATION (Hier Ihre Daten anpassen!)
    // =========================================================================
    const githubUsername = "DEIN_GITHUB_USERNAME"; // Ihr GitHub-Nutzername
    const repositoryName = "euromaster-puzzle-images"; // Repo-Name
    const totalImages = 50; // Anzahl der hochgeladenen Bilder (1.jpg, 2.jpg ...)

    // =========================================================================
    // 2. MONTAGS-LOGIK (Berechnet das Bild anhand der Kalenderwoche)
    // =========================================================================
    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    const currentWeek = getWeekNumber(new Date());
    const imageNumber = ((currentWeek - 1) % totalImages) + 1;
    const imageUrl = `https://raw.githubusercontent.com/${githubUsername}/${repositoryName}/main/${imageNumber}.jpg`;

    // =========================================================================
    // 3. SPIEL-VARIABLEN & INITIALISIERUNG
    // =========================================================================
    const board = document.getElementById("board");
    const timerEl = document.getElementById("timer");
    const movesEl = document.getElementById("moves");
    const messageEl = document.getElementById("message");

    const size = 3;         // 3x3 Grid
    const tileSize = 100;   // 100px pro Kachel
    let tiles = [];
    let emptyPos = { row: 2, col: 2 }; // Leeres Feld unten rechts
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let gameStarted = false;
    let gameFinished = false;

    // Bild vorladen & Spiel starten
    const puzzleImg = new Image();
    puzzleImg.src = imageUrl;
    puzzleImg.onload = () => initGame();
    puzzleImg.onerror = () => {
      messageEl.style.color = "#c62828";
      messageEl.innerText = "Fehler beim Laden des Wochenbilds.";
    };

    function initGame() {
      board.innerHTML = "";
      tiles = [];
      
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (r === size - 1 && c === size - 1) break; // Letztes Feld bleibt leer

          const tile = document.createElement("div");
          tile.classList.add("tile");
          tile.style.backgroundImage = `url('${imageUrl}')`;
          tile.style.backgroundPosition = `-${c * tileSize}px -${r * tileSize}px`;
          
          const pos = { row: r, col: c, correctRow: r, correctCol: c, element: tile };
          tiles.push(pos);

          tile.addEventListener("click", () => moveTile(pos));
          board.appendChild(tile);
          updatePosition(pos);
        }
      }
      shuffle();
    }

    function updatePosition(tile) {
      tile.element.style.top = `${tile.row * tileSize}px`;
      tile.element.style.left = `${tile.col * tileSize}px`;
    }

    // =========================================================================
    // 4. SPIEL-LOGIK (Mischen, Züge & Timer)
    // =========================================================================
    function moveTile(tile) {
      if (gameFinished) return;

      const isAdjacent = (Math.abs(tile.row - emptyPos.row) + Math.abs(tile.col - emptyPos.col)) === 1;

      if (isAdjacent) {
        if (!gameStarted) startTimer();

        // Positionen tauschen
        const tempRow = tile.row;
        const tempCol = tile.col;

        tile.row = emptyPos.row;
        tile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };

        updatePosition(tile);
        moves++;
        movesEl.innerText = moves;

        checkWin();
      }
    }

    function shuffle() {
      // 100 zufällige gültige Züge ausführen zum Mischen
      for (let i = 0; i < 100; i++) {
        const validTiles = tiles.filter(t => 
          (Math.abs(t.row - emptyPos.row) + Math.abs(t.col - emptyPos.col)) === 1
        );
        const randomTile = validTiles[Math.floor(Math.random() * validTiles.length)];
        
        const tempRow = randomTile.row;
        const tempCol = randomTile.col;
        randomTile.row = emptyPos.row;
        randomTile.col = emptyPos.col;
        emptyPos = { row: tempRow, col: tempCol };
        updatePosition(randomTile);
      }
    }

    function startTimer() {
      gameStarted = true;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // =========================================================================
    // 5. GEWINN-PRÜFUNG & MASTERNET BACKEND-ANBINDUNG
    // =========================================================================
    function checkWin() {
      const isSolved = tiles.every(t => t.row === t.correctRow && t.col === t.correctCol);
      if (isSolved) {
        clearInterval(timerInterval);
        gameFinished = true;

        messageEl.innerText = `Glückwunsch! Gelöst in ${seconds} Sek. (${moves} Züge)`;

        // Ergebnisse an das Masternet senden
        sendScoreToMasternet(seconds, moves);
      }
    }

    function sendScoreToMasternet(timeInSeconds, totalMoves) {
      console.log("Sende Daten an Masternet...", { timeInSeconds, totalMoves });

      /* 
        BEISPIEL FÜR API-ANBINDUNG AN IHR MASTERNET:

        fetch('/api/monday-challenge/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            week: currentWeek,
            time: timeInSeconds,
            moves: totalMoves
          })
        }).then(response => {
          console.log("Score erfolgreich gespeichert!");
        });
      */
    }
  </script>
</body>
</html>
